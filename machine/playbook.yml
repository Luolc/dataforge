# The data machine setup (machine/README.md). Run through bootstrap.sh, as the agent
# user, on the machine itself. Tasks that change the system use become; the
# rest act on the agent user's home.
- name: Data machine setup
  hosts: localhost
  gather_facts: false
  vars_files:
    - versions.yml
  vars:
    ansible_python_interpreter: /usr/bin/python3
    home: "{{ lookup('env', 'HOME') }}"
    user: "{{ lookup('env', 'USER') | default(lookup('pipe', 'id -un'), true) }}"

    # Overridable with -e or ~/.config/dataforge/setup.yml.
    # The personal zsh layer: oh-my-zsh, powerlevel10k and its prompt config.
    zsh_personal: true
    # Global git identity of the agent user; skipped while empty.
    git_user_name: ""
    git_user_email: ""
    # Where the user puts the token of the GitHub account the machine commits
    # and opens PRs with. The setup only hands this path to `gh auth login`;
    # it never reads the value itself.
    gh_token_file: "{{ home }}/.config/dataforge/github-token"
    # host:port of the account gateway, written into the shim's config.
    redcoast_client_address: ""
    # The setup's own tools: each run installs the latest release of each
    # (tasks/latest-release.yml lists the fields). Overridable, like the
    # rest, to install from somewhere else, as the setup test does.
    redcoast_client_release_url: https://github.com/Luolc/redcoast/releases
    # agent-constitution releases more than statute, so its latest release
    # is not necessarily statute's.
    statute_releases_api: https://api.github.com/repos/Luolc/agent-constitution/releases?per_page=100
    own_tools:
      - name: fleet
        url: https://github.com/Luolc/agent-fleet/releases
        sums: SHA256SUMS
        assets: [fleet-linux-amd64]
      - name: fednet
        url: https://github.com/Luolc/fednet/releases
        sums: SHA256SUMS
        assets: ["fednet_{tag}_linux_amd64"]
      - name: atb
        url: https://github.com/Luolc/agent-toolbox/releases
        sums: atb-x86_64-unknown-linux-musl.sha256
        assets: [atb-x86_64-unknown-linux-musl.tar.gz]
        tarball: true
      - name: statute
        url: https://github.com/Luolc/agent-constitution/releases
        api: "{{ statute_releases_api }}"
        tag_prefix: statute-v
        sums: statute-x86_64-unknown-linux-musl.sha256
        assets: [statute-x86_64-unknown-linux-musl.tar.gz]
        tarball: true
  tasks:
    - ansible.builtin.import_tasks: tasks/base.yml
    - ansible.builtin.import_tasks: tasks/docker.yml
    - ansible.builtin.import_tasks: tasks/vendor-apt.yml
    - ansible.builtin.import_tasks: tasks/tools.yml
    - ansible.builtin.import_tasks: tasks/claude-code.yml
    - ansible.builtin.import_tasks: tasks/gateway-client.yml
    - ansible.builtin.import_tasks: tasks/zsh.yml
    - ansible.builtin.import_tasks: tasks/identity.yml
    - ansible.builtin.import_tasks: tasks/agent-files.yml
