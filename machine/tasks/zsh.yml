# zsh for the agent user. The base layer (PATH, the gateway shim first) is
# always installed; the personal layer (oh-my-zsh, powerlevel10k and its
# prompt config) only with zsh_personal, the default.

- name: zsh is the login shell
  become: true
  ansible.builtin.user:
    name: "{{ user }}"
    shell: /usr/bin/zsh

- name: zshenv
  ansible.builtin.copy:
    src: files/zsh/zshenv
    dest: "{{ home }}/.zshenv"
    mode: "0644"

- name: zshrc
  ansible.builtin.template:
    src: files/zsh/zshrc.j2
    dest: "{{ home }}/.zshrc"
    mode: "0644"

- name: Personal zsh layer
  when: zsh_personal | bool
  block:
    - name: oh-my-zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ home }}/.oh-my-zsh"
        version: "{{ oh_my_zsh_commit }}"

    - name: powerlevel10k
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ home }}/.oh-my-zsh/custom/themes/powerlevel10k"
        version: "{{ powerlevel10k_commit }}"

    - name: powerlevel10k prompt config
      ansible.builtin.copy:
        src: files/zsh/p10k.zsh
        dest: "{{ home }}/.p10k.zsh"
        mode: "0644"
