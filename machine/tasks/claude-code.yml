# Claude Code in the native installer's layout: one binary per version under
# ~/.local/share/claude/versions, and ~/.local/bin/claude pointing at it. The
# binary is fetched directly so its digest can be pinned, and DISABLE_UPDATES
# in the settings below keeps the version the pinned one.

- name: Claude Code versions directory
  ansible.builtin.file:
    path: "{{ home }}/.local/share/claude/versions"
    state: directory
    mode: "0755"

- name: Claude Code binary
  ansible.builtin.get_url:
    url: "https://downloads.claude.ai/claude-code-releases/{{ claude_code_version }}/linux-x64/claude"
    dest: "{{ home }}/.local/share/claude/versions/{{ claude_code_version }}"
    checksum: "sha256:{{ claude_code_sha256 }}"
    mode: "0755"

- name: Claude Code on PATH
  ansible.builtin.file:
    src: "{{ home }}/.local/share/claude/versions/{{ claude_code_version }}"
    dest: "{{ home }}/.local/bin/claude"
    state: link
    force: true

# The keys the setup owns are in files/claude-settings.json (for
# ~/.claude/settings.json) and files/claude-state.json (for ~/.claude.json),
# which the dotfiles' modify templates (tasks/dotfiles.yml) merge in:
# - hasCompletedOnboarding and skipDangerousModePermissionPrompt: agents on a
#   data machine are started with --dangerously-skip-permissions and nobody
#   is at the screen, so the first-run onboarding and the bypass-permissions
#   warning must not appear.
# - autoMemoryEnabled false and the other DISABLE_* variables: no memory, no
#   error reports or feedback uploads.
# - DISABLE_UPDATES: besides the background updates it turns off, `claude
#   update` and `claude install` refuse to run, so even a claude not started
#   through the gateway client stays at the pinned version. The setup itself
#   installs by download and symlink, which it does not affect.
# - model and autoCompact*: the default model and context window for agents
#   started without --model.
# - effortLevel medium: the default effort for agents started without --effort.
# - promptSuggestionEnabled false: the suggested prompt in the input box reads
#   back like a typed draft when an agent reads a pane.
# - showThinkingSummaries true: requests thinking summaries from the API and
#   shows them in the conversation and the transcript view; the default is
#   false.
# - disableRemoteControl: data machines have no Remote Control.
# - statusLine: one line under the input box from the dotfiles'
#   ~/.claude/statusline-herdr.sh (directory, model, context tokens over the
#   window size and its percentage, the 5-hour and weekly quota), so that a
#   session's context length shows at a glance. Claude Code runs the command
#   in a shell, which expands the ~. Claude Code redraws the line on each new
#   message; refreshInterval 60 also reruns it once a minute in between.
#
# Keys the setup does not own stay as they are. The one exception is
# env.DISABLE_AUTOUPDATER in ~/.claude/settings.json, which is removed: the
# gateway client sets it for the sessions it starts and refuses to start
# claude while a settings file sets it. For the same reason the setup owns no
# auth, proxy or gateway key.
