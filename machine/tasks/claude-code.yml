# Claude Code in the native installer's layout: one binary per version under
# ~/.local/share/claude/versions, and ~/.local/bin/claude pointing at it. The
# binary is fetched directly so its digest can be pinned, and DISABLE_UPDATES
# in the settings below keeps the version the pinned one.

- name: Claude Code versions directory
  ansible.builtin.file:
    path: "{{ home }}/.local/share/claude/versions"
    state: directory
    mode: "0755"

- name: Claude Code binary
  ansible.builtin.get_url:
    url: "https://downloads.claude.ai/claude-code-releases/{{ claude_code_version }}/linux-x64/claude"
    dest: "{{ home }}/.local/share/claude/versions/{{ claude_code_version }}"
    checksum: "sha256:{{ claude_code_sha256 }}"
    mode: "0755"

- name: Claude Code on PATH
  ansible.builtin.file:
    src: "{{ home }}/.local/share/claude/versions/{{ claude_code_version }}"
    dest: "{{ home }}/.local/bin/claude"
    state: link
    force: true

# The setup writes neither ~/.claude/settings.json nor ~/.claude.json: both
# belong to the machine's owner. It only checks the four keys it cannot run
# without, and stops naming each one that is missing (machine/README.md,
# "Claude Code settings"):
# - hasCompletedOnboarding and skipDangerousModePermissionPrompt: agents on a
#   data machine are started with --dangerously-skip-permissions and nobody
#   is at the screen, so the first-run onboarding and the bypass-permissions
#   warning must not appear.
# - env.DISABLE_UPDATES: besides the background updates it turns off, `claude
#   update` and `claude install` refuse to run, so even a claude not started
#   through the gateway client stays at the pinned version. The setup itself
#   installs by download and symlink, which it does not affect.
# - no env.DISABLE_AUTOUPDATER: the gateway client sets it for the sessions it
#   starts and refuses to start claude while a settings file sets it.
# Until redcoast_client_address is set the shim cannot start Claude Code at
# all, so the check waits for it, as the shim's config does
# (tasks/gateway-client.yml says so in its output).

- name: Read Claude Code settings
  when: redcoast_client_address != ""
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ home }}/.claude/settings.json"
    - "{{ home }}/.claude.json"
  register: claude_files
  failed_when: false

- name: Claude Code settings are in place
  when: redcoast_client_address != ""
  vars:
    settings_path: "{{ home }}/.claude/settings.json"
    state_path: "{{ home }}/.claude.json"
    settings: "{{ (claude_files.results[0].content | b64decode | from_json) if 'content' in claude_files.results[0] else {} }}"
    claude_state: "{{ (claude_files.results[1].content | b64decode | from_json) if 'content' in claude_files.results[1] else {} }}"
    settings_env: "{{ settings.env | default({}) }}"
    missing: >-
      {{
        ([] if claude_state.hasCompletedOnboarding | default(false) is sameas true
            else ['hasCompletedOnboarding is not true in ' ~ state_path])
        + ([] if settings.skipDangerousModePermissionPrompt | default(false) is sameas true
            else ['skipDangerousModePermissionPrompt is not true in ' ~ settings_path])
        + ([] if 'DISABLE_UPDATES' in settings_env
            else ['env.DISABLE_UPDATES is not set in ' ~ settings_path])
        + (['env.DISABLE_AUTOUPDATER is set in ' ~ settings_path] if 'DISABLE_AUTOUPDATER' in settings_env
            else [])
      }}
  ansible.builtin.assert:
    that: missing | length == 0
    fail_msg: >-
      Claude Code settings: {{ missing | join('; ') }}.
      Put them in place as machine/README.md, "Claude Code settings", shows.
    quiet: true
