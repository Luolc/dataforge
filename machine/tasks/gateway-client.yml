# The account gateway client (docs/design.md, machine/README.md): from the
# latest redcoast release, `redcoast-client` and the shim
# redcoast-client-shim-full installed as `claude` next to it. Each version
# gets its own directory under ~/.local/libexec/redcoast-client, `current`
# points at the one in use, and zshenv puts `current` first on PATH. Every
# download is checked against the release's SHA256SUMS before it lands in the
# new directory, and nothing is switched unless both are, so a bad download
# leaves the previous version in use.

- name: Gateway client | find the latest release
  ansible.builtin.include_tasks: latest-release.yml
  vars:
    release:
      name: gateway client
      url: "{{ redcoast_client_release_url }}"
      sums: SHA256SUMS
      assets: [redcoast-client-linux-amd64, redcoast-client-shim-full]

- name: Gateway client
  vars:
    gw_root: "{{ home }}/.local/libexec/redcoast-client"
    gw_dir: "{{ gw_root }}/{{ release_version }}"
    gw_url: "{{ redcoast_client_release_url }}/download/{{ release_tag }}"
  block:
    # Installed means: both programs in the version's directory have the
    # release's digests. A release rebuilt under the same tag reinstalls.
    - name: Gateway client | installed copy is the latest one
      ansible.builtin.shell:
        cmd: >-
          cd "$DIR" && printf '%s  redcoast-client\n%s  claude\n' "$CLIENT" "$SHIM"
          | sha256sum --check --strict --quiet -
      environment:
        DIR: "{{ gw_dir }}"
        CLIENT: "{{ release_sha256[0] }}"
        SHIM: "{{ release_sha256[1] }}"
      register: gw_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Gateway client | install from the release
      when: gw_installed.rc != 0
      block:
        - name: Gateway client | clear a half-made copy
          ansible.builtin.file:
            path: "{{ gw_dir }}.new"
            state: absent

        - name: Gateway client | new directory
          ansible.builtin.file:
            path: "{{ gw_dir }}.new"
            state: directory
            mode: "0755"

        # get_url checks the digest of the downloaded file before it writes
        # dest, and fails on a mismatch. Check mode does not make the new
        # directory, so there is nowhere to download to; the task above
        # reports the change.
        - name: Gateway client | download
          when: not ansible_check_mode
          ansible.builtin.get_url:
            url: "{{ gw_url }}/{{ item.asset }}"
            dest: "{{ gw_dir }}.new/{{ item.name }}"
            checksum: "sha256:{{ item.sha256 }}"
            mode: "0755"
          loop:
            - { asset: redcoast-client-linux-amd64, name: redcoast-client, sha256: "{{ release_sha256[0] }}" }
            - { asset: redcoast-client-shim-full, name: claude, sha256: "{{ release_sha256[1] }}" }
          loop_control:
            label: "{{ item.asset }}"

        # The old directory is only set aside until the new one is in place,
        # and put back if that fails, so `current` never points at nothing.
        - name: Gateway client | move into place
          ansible.builtin.shell:
            cmd: |
              set -e
              rm -rf "$DIR.old"
              [ ! -e "$DIR" ] || mv "$DIR" "$DIR.old"
              if ! mv "$DIR.new" "$DIR"; then
                [ ! -e "$DIR.old" ] || mv "$DIR.old" "$DIR"
                exit 1
              fi
              rm -rf "$DIR.old"
          environment:
            DIR: "{{ gw_dir }}"

    - name: Gateway client | switch current
      ansible.builtin.file:
        src: "{{ release_version }}"
        dest: "{{ gw_root }}/current"
        state: link
        force: true

    # The shim's config, in the format of redcoast's
    # cmd/redcoast-client/README.md ("The shims"). redcoast-client-shim-full
    # sends every start through the gateway and ignores `prefix=`; any problem
    # with this file makes it exit 3 instead of starting the real Claude. The
    # empty `prefix=` below is harmless. The machine credential is only
    # referenced by path; the user creates it. The gateway address is per
    # deployment, so it comes from the machine's settings, not from this
    # repo; until it is set, the file is not written and the shim has no
    # config to start Claude with.
    - name: Gateway client | address missing
      when: redcoast_client_address == ""
      ansible.builtin.debug:
        msg: "No redcoast_client_address in ~/.config/dataforge/setup.yml; shim.env not written, so the claude shim has no config yet (see machine/README.md)."

    - name: Gateway client | config directory
      when: redcoast_client_address != ""
      ansible.builtin.file:
        path: "{{ home }}/.config/redcoast-client"
        state: directory
        mode: "0700"

    - name: Gateway client | shim config
      when: redcoast_client_address != ""
      ansible.builtin.copy:
        dest: "{{ home }}/.config/redcoast-client/shim.env"
        mode: "0600"
        content: |
          address={{ redcoast_client_address }}
          credential_file=$HOME/.config/redcoast-client/machine-credential
          claude=$HOME/.local/bin/claude
          prefix=
