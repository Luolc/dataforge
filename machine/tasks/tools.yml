# Release binaries: herdr, gh, Pi and Codex CLI pinned by sha256 in
# versions.yml, then the setup's own tools at their latest release. get_url
# skips the download when the file at dest already has the expected digest,
# so a rerun changes nothing.

- name: herdr
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/herdrdev/herdr/releases/download/v{{ herdr_version }}/herdr-linux-x86_64"
    dest: /usr/local/bin/herdr
    checksum: "sha256:{{ herdr_sha256 }}"
    mode: "0755"

- name: gh directory
  become: true
  ansible.builtin.file:
    path: /opt/gh
    state: directory
    mode: "0755"

- name: gh tarball
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/cli/cli/releases/download/v{{ gh_version }}/gh_{{ gh_version }}_linux_amd64.tar.gz"
    dest: "/opt/gh/gh_{{ gh_version }}_linux_amd64.tar.gz"
    checksum: "sha256:{{ gh_sha256 }}"
    mode: "0644"

# Check mode does not download the tarball, so there is nothing to unpack;
# the task above reports the change.
- name: gh unpacked
  when: not ansible_check_mode
  become: true
  ansible.builtin.unarchive:
    src: "/opt/gh/gh_{{ gh_version }}_linux_amd64.tar.gz"
    dest: /opt/gh
    remote_src: true
    creates: "/opt/gh/gh_{{ gh_version }}_linux_amd64/bin/gh"

- name: gh on PATH
  become: true
  ansible.builtin.file:
    src: "/opt/gh/gh_{{ gh_version }}_linux_amd64/bin/gh"
    dest: /usr/local/bin/gh
    state: link
    force: true

# Pi's tarball holds one pi/ directory; Codex CLI's holds the package
# itself: the codex program in bin/, and next to it the rg and sandbox
# helpers that its codex-package.json names.
- name: Pinned tarballs
  ansible.builtin.include_tasks: pinned-tarball.yml
  loop:
    - name: pi
      version: "{{ pi_version }}"
      sha256: "{{ pi_sha256 }}"
      url: "https://github.com/earendil-works/pi/releases/download/v{{ pi_version }}/pi-linux-x64.tar.gz"
      tar_options: [--strip-components=1]
      program: pi
    - name: codex
      version: "{{ codex_version }}"
      sha256: "{{ codex_sha256 }}"
      url: "https://github.com/openai/codex/releases/download/rust-v{{ codex_version }}/codex-package-x86_64-unknown-linux-musl.tar.gz"
      program: bin/codex
  loop_control:
    loop_var: pinned
    label: "{{ pinned.name }}"

# fleet, fednet, atb and statute, each at its latest release. fednet also
# upgrades itself to its latest release; once it has, the digests match and
# the setup leaves it as it is.
- name: Own tools
  ansible.builtin.include_tasks: own-tool.yml
  loop: "{{ own_tools }}"
  loop_control:
    loop_var: tool
    label: "{{ tool.name }}"
