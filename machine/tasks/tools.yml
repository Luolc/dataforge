# Release binaries pinned by sha256. get_url skips the download when the file
# at dest already has the pinned digest, so a rerun changes nothing.

- name: herdr
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/herdrdev/herdr/releases/download/v{{ herdr_version }}/herdr-linux-x86_64"
    dest: /usr/local/bin/herdr
    checksum: "sha256:{{ herdr_sha256 }}"
    mode: "0755"

- name: gh directory
  become: true
  ansible.builtin.file:
    path: /opt/gh
    state: directory
    mode: "0755"

- name: gh tarball
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/cli/cli/releases/download/v{{ gh_version }}/gh_{{ gh_version }}_linux_amd64.tar.gz"
    dest: "/opt/gh/gh_{{ gh_version }}_linux_amd64.tar.gz"
    checksum: "sha256:{{ gh_sha256 }}"
    mode: "0644"

- name: gh unpacked
  become: true
  ansible.builtin.unarchive:
    src: "/opt/gh/gh_{{ gh_version }}_linux_amd64.tar.gz"
    dest: /opt/gh
    remote_src: true
    creates: "/opt/gh/gh_{{ gh_version }}_linux_amd64/bin/gh"

- name: gh on PATH
  become: true
  ansible.builtin.file:
    src: "/opt/gh/gh_{{ gh_version }}_linux_amd64/bin/gh"
    dest: /usr/local/bin/gh
    state: link
    force: true

- name: fleet
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/Luolc/agent-fleet/releases/download/v{{ fleet_version }}/fleet-linux-amd64"
    dest: /usr/local/bin/fleet
    checksum: "sha256:{{ fleet_sha256 }}"
    mode: "0755"

# fednet replaces its own binary when a new release comes out, so the pinned
# version is only installed where there is none yet; a rerun must not take
# an upgraded fednet back to the pin.
- name: fednet installed
  ansible.builtin.stat:
    path: /usr/local/bin/fednet
    get_checksum: false
  register: fednet_binary

- name: fednet
  when: not fednet_binary.stat.exists
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/Luolc/fednet/releases/download/v{{ fednet_version }}/fednet_v{{ fednet_version }}_linux_amd64"
    dest: /usr/local/bin/fednet
    checksum: "sha256:{{ fednet_sha256 }}"
    mode: "0755"

# atb and statute ship as a tarball holding the one binary, unpacked like gh
# into a directory per version under /opt.
- name: Tarball tools
  become: true
  vars:
    dir: "/opt/{{ item.name }}/{{ item.version }}"
  block:
    - name: Tarball tools | version directory
      ansible.builtin.file:
        path: "{{ dir }}"
        state: directory
        mode: "0755"
      loop: "{{ tarball_tools }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Tarball tools | tarball
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ dir }}.tar.gz"
        checksum: "sha256:{{ item.sha256 }}"
        mode: "0644"
      loop: "{{ tarball_tools }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Tarball tools | unpacked
      ansible.builtin.unarchive:
        src: "{{ dir }}.tar.gz"
        dest: "{{ dir }}"
        remote_src: true
        owner: root
        group: root
        creates: "{{ dir }}/{{ item.name }}"
      loop: "{{ tarball_tools }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Tarball tools | on PATH
      ansible.builtin.file:
        src: "{{ dir }}/{{ item.name }}"
        dest: "/usr/local/bin/{{ item.name }}"
        state: link
        force: true
      loop: "{{ tarball_tools }}"
      loop_control:
        label: "{{ item.name }}"
