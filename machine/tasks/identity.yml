# The gh login of the GitHub account the machine commits and opens PRs with.
# The setup never writes the global git configuration (~/.gitconfig): the
# git identity and credential helper belong to the machine's owner. The token
# file is put in place by the user (machine/README.md, step 1); the setup
# passes its path to gh and never reads the value. A missing file skips the
# step.

- name: GitHub token file
  ansible.builtin.stat:
    path: "{{ gh_token_file }}"
    get_checksum: false
  register: gh_token

- name: gh login
  when: gh_token.stat.exists
  block:
    - name: gh login | current state
      ansible.builtin.command: gh auth status --hostname github.com
      register: gh_status
      changed_when: false
      failed_when: false

    - name: gh login | log in with the token file
      when: gh_status.rc != 0
      ansible.builtin.shell:
        cmd: gh auth login --hostname github.com --with-token < "$TOKEN_FILE"
      environment:
        TOKEN_FILE: "{{ gh_token_file }}"

- name: GitHub token file missing
  when: not gh_token.stat.exists
  ansible.builtin.debug:
    msg: "No token at {{ gh_token_file }}; gh is not logged in (see machine/README.md)."
