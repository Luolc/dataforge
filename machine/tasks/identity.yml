# Git identity and the gh login of the GitHub account the machine commits and
# opens PRs with. The token file is put in place by the user
# (machine/README.md, step 1); the setup passes its path to gh and never reads
# the value. Values left empty or a missing file skip the step.

- name: Git identity
  ansible.builtin.shell:
    cmd: |
      [ "$(git config --global --get user.{{ item.key }})" = "$VALUE" ] && exit 0
      git config --global user.{{ item.key }} "$VALUE" && echo changed
  environment:
    VALUE: "{{ item.value }}"
  loop: "{{ {'name': git_user_name, 'email': git_user_email} | dict2items }}"
  when: item.value != ""
  register: git_identity
  changed_when: git_identity.stdout == "changed"

- name: GitHub token file
  ansible.builtin.stat:
    path: "{{ gh_token_file }}"
    get_checksum: false
  register: gh_token

- name: gh login
  when: gh_token.stat.exists
  block:
    - name: gh login | current state
      ansible.builtin.command: gh auth status --hostname github.com
      register: gh_status
      changed_when: false
      failed_when: false

    - name: gh login | log in with the token file
      when: gh_status.rc != 0
      ansible.builtin.shell:
        cmd: gh auth login --hostname github.com --with-token < "$TOKEN_FILE" && gh auth setup-git --hostname github.com
      environment:
        TOKEN_FILE: "{{ gh_token_file }}"

- name: GitHub token file missing
  when: not gh_token.stat.exists
  ansible.builtin.debug:
    msg: "No token at {{ gh_token_file }}; gh is not logged in (see machine/README.md)."
