# Tailscale, the 1Password CLI and Node.js from their vendors' apt
# repositories, set up like Docker's (tasks/docker.yml): a pinned key, a
# deb822 source and pinned package versions. Google Chrome comes from its
# pinned .deb instead (below). Only the programs are installed; nothing here
# joins a tailnet or signs in to an account.

- name: Vendor apt keys
  become: true
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/etc/apt/keyrings/{{ item.file }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0644"
  loop:
    - { url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg, file: tailscale.gpg, sha256: "{{ tailscale_apt_gpg_sha256 }}" }
    - { url: https://downloads.1password.com/linux/keys/1password.asc, file: 1password.asc, sha256: "{{ op_apt_gpg_sha256 }}" }
    - { url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key, file: nodesource.asc, sha256: "{{ nodesource_apt_gpg_sha256 }}" }
  loop_control:
    label: "{{ item.file }}"

- name: Vendor apt repositories
  become: true
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/{{ item.name }}.sources"
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ item.uri }}
      Suites: {{ item.suite }}
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/{{ item.key }}
  loop:
    - { name: tailscale, uri: https://pkgs.tailscale.com/stable/ubuntu, suite: noble, key: tailscale.gpg }
    - { name: 1password, uri: https://downloads.1password.com/linux/debian/amd64, suite: stable, key: 1password.asc }
    # The URI fixes the major version (versions.yml).
    - { name: nodesource, uri: "https://deb.nodesource.com/node_{{ node_major }}.x", suite: nodistro, key: nodesource.asc }
  loop_control:
    label: "{{ item.name }}"
  register: vendor_repos

# Check mode adds no source, so the packages of a source it would add cannot
# be found yet; it reports the error and goes on to preview the rest.
- name: Tailscale, the 1Password CLI and Node.js
  become: true
  ansible.builtin.apt:
    name:
      - "tailscale={{ tailscale_version }}"
      - "1password-cli={{ op_version }}"
      - "nodejs={{ nodejs_version }}"
    update_cache: "{{ vendor_repos.changed }}"
  ignore_errors: "{{ ansible_check_mode and vendor_repos.changed }}"

# Google's apt repository keeps only its latest release, so the setup
# installs the pinned .deb from the repository's pool and adds no source:
# with none, apt upgrade cannot move Chrome off the pinned version. Its
# dependencies come from the Ubuntu archive. Left alone, the package's
# postinst and its /etc/cron.daily job would each add google-chrome.sources;
# with both switches false they leave the sources alone.
- name: Keep the Chrome package from adding its own apt source
  become: true
  ansible.builtin.copy:
    dest: /etc/default/google-chrome
    mode: "0644"
    content: |
      # Managed by the dataforge machine setup: Chrome has no apt source here.
      repo_add_once="false"
      repo_reenable_on_distupgrade="false"

- name: Google Chrome .deb
  become: true
  block:
    - name: Google Chrome directory
      ansible.builtin.file:
        path: /opt/google-chrome
        state: directory
        mode: "0755"
      register: chrome_dir

    # Check mode creates no directory, and get_url fails on a missing one;
    # the directory reports the change instead.
    - name: Google Chrome download
      when: not (ansible_check_mode and chrome_dir.changed)
      ansible.builtin.get_url:
        url: "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_{{ google_chrome_version }}_amd64.deb"
        dest: "/opt/google-chrome/google-chrome-stable_{{ google_chrome_version }}_amd64.deb"
        checksum: "sha256:{{ google_chrome_sha256 }}"
        mode: "0644"
      register: chrome_deb
  rescue:
    - name: Google Chrome download failed
      ansible.builtin.fail:
        msg: >-
          google-chrome-stable: the pinned .deb {{ google_chrome_version }} could not be
          downloaded or does not match google_chrome_sha256 (versions.yml):
          {{ ansible_failed_result.msg }}

- name: Installed Google Chrome version
  ansible.builtin.command: dpkg-query -W -f ${Version} google-chrome-stable
  register: chrome_installed
  changed_when: false
  failed_when: false
  check_mode: false

# apt-get resolves the .deb's dependencies from the Ubuntu archive,
# including the virtual libasound2 (libasound2t64 on Ubuntu 24.04). Check
# mode runs no command; the download, or on a new machine the directory,
# reports the change.
- name: Google Chrome
  when: chrome_installed.stdout != google_chrome_version
  become: true
  ansible.builtin.command: >-
    apt-get install -y -q --allow-downgrades
    /opt/google-chrome/google-chrome-stable_{{ google_chrome_version }}_amd64.deb
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Earlier Google Chrome .debs
  ansible.builtin.find:
    paths: /opt/google-chrome
    patterns: "google-chrome-stable_*_amd64.deb"
    excludes: "google-chrome-stable_{{ google_chrome_version }}_amd64.deb"
  register: earlier_chrome_debs

- name: Only the pinned Google Chrome .deb kept
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ earlier_chrome_debs.files }}"
  loop_control:
    label: "{{ item.path }}"
