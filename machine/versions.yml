# The clients redcoast-client starts for Codex gateway sessions, each from
# its release tarball (tasks/pinned-tarball.yml), with the tarball's sha256
# from the release's asset list. Pi's is a compiled binary with its assets,
# so none of its npm dependencies are fetched; Codex CLI's is the package its
# npm wrapper runs. Pi stays at 1.2.0 until the gateway client's launcher,
# which is written against that version's environment variables, moves.
pi_version: 1.2.0
pi_sha256: 00fc36cffdebceea5a48230da62cf3fb463178f8fe185766652f96002a246847
codex_version: 0.159.3
codex_sha256: 3930f31ac5fca861ea3e444e2683f261190d96b63fba58e0a40a879174369cdf

