# Every pinned version the data machine setup installs (docs/design.md).
# Upgrades are PRs that change this file. The tools the repository owner
# publishes (fleet, fednet, atb, statute and the gateway client) are not
# pinned: each run installs their latest release, checked against that
# release's checksum file (playbook.yml, own_tools). bootstrap.sh reads some
# keys with sed, so keep those as plain `key: value` lines; the playbook loads
# the whole file.

# From the Ubuntu 24.04 archive, at whatever version the release currently
# ships: the archive keeps only the latest patch release, so an exact pin
# would stop a new machine from installing. bootstrap.sh installs the first
# list (what Ansible itself needs), the playbook the second.
ubuntu_bootstrap_packages: ca-certificates curl python3 python3-apt
ubuntu_packages: [git, jq, zsh, direnv]

# Read by bootstrap.sh: uv itself, then Ansible run through uv.
uv_version: 0.12.22
uv_sha256: b9980552309f09c15172b8be828555e375097f16deb459795ce7bfd200380f0b
ansible_core_version: 2.21.5
ansible_python_version: 3.13

# Docker's own apt repository keeps old versions, so every package from it
# is pinned.
docker_apt_gpg_sha256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
docker_version: "5:29.8.2-1~ubuntu.24.04~noble"
containerd_version: "2.3.6-1~ubuntu.24.04~noble"
docker_buildx_version: "0.37.1-1~ubuntu.24.04~noble"
docker_compose_version: "5.6.0-1~ubuntu.24.04~noble"

# Tailscale's and 1Password's apt repositories keep old versions, so their
# packages are pinned like Docker's. Only the programs are installed: the
# setup joins no tailnet and signs in to no account.
tailscale_apt_gpg_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
tailscale_version: "1.104.1"
