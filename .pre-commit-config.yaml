# Hooks: secret scan (gitleaks), Chinese Markdown typography (limae) and the
# statute compile check.
repos:
  # Runs first: a leaked secret must be stopped before other hooks rewrite
  # staged files. The upstream entry scans the staged diff only (it ends in
  # --staged); CI scans the commits of each pull request or push (the gitleaks
  # step in .github/workflows/ci.yml), and .github/workflows/gitleaks.yml
  # scans the full history weekly.
  #
  # --redact is repeated here on purpose: the upstream entry already has it,
  # but inherited args are invisible in this file and could be dropped on a
  # rev bump. A scanner without --redact prints the secret it found.
  #
  # When bumping rev, check the upstream entry still contains --staged;
  # otherwise the hook silently scans the whole repo instead.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]
  # The -pre-commit mirror ships a python hook that installs the prebuilt
  # wheel from PyPI; the main limae repo builds from Rust source, which makes
  # every cold hook environment slow to build.
  - repo: https://github.com/Luolc/limae-pre-commit
    rev: v0.13.4
    hooks:
      - id: limae
  # The statute mirror installs the statute release named by rev from PyPI.
  # rev must be v<version> of the version statute.lock names: statute compile
  # --check fails when statute.lock was written by another version, so the
  # two change together. The mirror's files pattern also covers this
  # file, so a rev change runs the hook.
  - repo: https://github.com/Luolc/statute-pre-commit
    rev: v0.1.23
    hooks:
      # --check writes nothing: AGENTS.md and the skills statute copies and
      # links must match a fresh compile of statute.toml, statute.lock and the
      # local rules. The private output, which git ignores, is not compared.
      - id: statute-compile
