# Hooks: secret scan (gitleaks), Chinese Markdown typography (limae), the
# statute compile check, the uv.lock check, ruff and pydoclint on python/, and
# Prettier on web/.
repos:
  # Runs first: a leaked secret must be stopped before other hooks rewrite
  # staged files. The upstream entry scans the staged diff only (it ends in
  # --staged); CI scans the commits of each pull request or push (the gitleaks
  # step in .github/workflows/ci.yml), and .github/workflows/gitleaks.yml
  # scans the full history weekly.
  #
  # --redact is repeated here on purpose: the upstream entry already has it,
  # but inherited args are invisible in this file and could be dropped on a
  # rev bump. A scanner without --redact prints the secret it found.
  #
  # When bumping rev, check the upstream entry still contains --staged;
  # otherwise the hook silently scans the whole repo instead.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]
  # The -pre-commit mirror ships a python hook that installs the prebuilt
  # wheel from PyPI; the main limae repo builds from Rust source, which makes
  # every cold hook environment slow to build.
  - repo: https://github.com/Luolc/limae-pre-commit
    rev: v0.13.4
    hooks:
      - id: limae
  # The statute mirror installs the statute release named by rev from PyPI.
  # rev must be v<version> of the version statute.lock names: statute compile
  # --check fails when statute.lock was written by another version, so the
  # two change together. The mirror's files pattern also covers this
  # file, so a rev change runs the hook.
  - repo: https://github.com/Luolc/statute-pre-commit
    rev: v0.1.32
    hooks:
      # --check writes nothing: AGENTS.md and the skills statute copies and
      # links must match a fresh compile of statute.toml, statute.lock and the
      # local rules. The private output, which git ignores, is not compared.
      - id: statute-compile
  # Keeps python/uv.lock in step with python/pyproject.toml: fails when
  # `uv lock` would change the lock. rev is the uv version CI installs, so the
  # two change together.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock
        args: ["--project", "python"]
        files: ^python/(pyproject\.toml|uv\.lock)$
  # Lint and format check only; the type check and the tests run before a
  # push and in CI. rev is the ruff version python/pyproject.toml pins, so
  # the two change together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        files: ^python/
      - id: ruff-format
        args: ["--check"]
        files: ^python/
  # Docstring sections against the signatures. rev is the pydoclint version
  # python/pyproject.toml pins, so the two change together; the settings are
  # in its [tool.pydoclint], which pydoclint reads only from the file --config
  # names.
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.11.0
    hooks:
      - id: pydoclint
        args: ["--config=python/pyproject.toml", "--quiet"]
        files: ^python/
  # web/: Prettier from web/node_modules (run `npm --prefix web ci` first), so
  # its version and plugins are the ones web/package-lock.json pins. It checks
  # all of web/, not only the staged files. ESLint is not a hook: its rules
  # need type information, and it takes about 8 seconds on web/. CI skips
  # this hook, since setup-node and npm ci come later there, and runs both
  # with `npm run lint` in the web checks.
  - repo: local
    hooks:
      - id: web-prettier
        name: prettier (web)
        language: system
        entry: npm --prefix web run --silent format:check
        files: ^web/
        pass_filenames: false
