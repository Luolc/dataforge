[title]
en = "Take icons from Lucide, and a file's type icon from Material Icon Theme"

[text.statement]
en = "Take every icon on this repository's pages from Lucide, except the icon that shows a file's type in a file tree, which you take from Material Icon Theme; draw none by hand, and use no character or emoji as an icon."

[text.reason]
en = '''
Icons from one library share one stroke, one size and one style. A file tree reads faster when each file's type has the colored mark readers know from their editors, such as Python's snakes, which Lucide does not draw; Material Icon Theme does, for every type the tree shows. Every other icon stays with Lucide, so the pages take icons from no third source.
'''

[text.verification]
en = '''
A file's type icon is the one beside a file's name in a file tree that stands for the file's type, as chosen by its name or extension. A folder's icon in a file tree counts as one. An icon recolored to meet {@rule:52} is still from its library.

Violated when a change adds to a page a file's type icon that is not from Material Icon Theme, any other icon that is not from Lucide, an icon drawn by hand, or a character or emoji standing for an icon.
'''
