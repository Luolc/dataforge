[title]
en = "Start no real Claude from an automated test"

[text.statement]
en = "Start no real Claude from an automated test, the setup test among them."

[text.reason]
en = '''
A real Claude spends model turns and needs a login; the automated tests run on every change and in CI, so they use a fake `claude` in its place.
'''

[text.verification]
en = '''
Violated when a change lets an automated test start the real Claude Code.
'''
