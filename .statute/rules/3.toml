[title]
en = "Link each invariant in the design to the test that guards it"

[text.statement]
en = "Link each invariant in `docs/design.md` to the test that guards it, or mark it \"untested\" and list it in the description of the pull request that adds it."

[text.reason]
en = '''
An invariant is only as good as the test that fails when it breaks; one with no test is visibly marked, so that a reader does not take it as guarded.
'''

[text.verification]
en = '''
Violated when a change leaves an invariant in `docs/design.md` with neither a link to a test nor the mark "untested", or adds one marked "untested" without listing it in its pull request description.
'''
