[title]
en = "Right-align columns of numbers"

[text.statement]
en = "Right-align every column of numbers in a table on a page."

[text.reason]
en = '''
With the digits lined up by place, a reader compares costs and durations down a column without reading each one.
'''

[text.verification]
en = '''
Violated when a table column whose cells are numbers, such as costs, durations or counts, is aligned otherwise.
'''
