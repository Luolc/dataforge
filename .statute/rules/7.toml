[title]
en = "Do not hold a ready pull request back for check to finish"

[text.statement]
en = "Do not hold back a pull request that is ready to merge only because its run of the CI job `check` in `.github/workflows/ci.yml` has not finished."

[text.reason]
en = '''
`check` is not a required status check on `main`, so a slow run does not hold up a merge; a run that has already failed still stops one.
'''

[text.verification]
en = '''
Violated when an agent that may merge a pull request leaves it unmerged only to wait for its run of `check` to finish.
'''
