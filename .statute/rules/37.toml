[title]
en = "Right-align columns of numbers, with tabular figures"

[text.statement]
en = "Right-align every column of numbers on a page and set its digits with tabular figures (`font-variant-numeric: tabular-nums`)."

[text.reason]
en = '''
With the digits lined up by place, a reader compares costs and durations down a column without reading each one.
'''

[text.verification]
en = '''
Violated when a column whose cells are numbers, such as costs, durations or counts, is aligned otherwise or set without tabular figures.
'''
