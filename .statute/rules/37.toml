[title]
en = "Define each kind of object's status words in one place"

[text.statement]
en = "Define the status words of each kind of object in one place, and take every status word a page shows from there."

[text.reason]
en = '''
One list per kind keeps a page from calling the same state by two words, and makes adding a state one change, with its tone and icon set next to it.
'''

[text.verification]
en = '''
Violated when a page or component writes a status word as a literal instead of taking it from its kind's list, or when one kind of object has status words defined in more than one place.
'''
