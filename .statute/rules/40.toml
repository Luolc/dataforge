[title]
en = "Say how many items a filter hides"

[text.statement]
en = "When a filter hides items of a list, say at the list how many items it hides."

[text.reason]
en = '''
A filtered list that does not say so reads as the whole list, and a reader takes the missing rows for rows that never existed.
'''

[text.verification]
en = '''
Violated when a list with an active filter hides items without showing their number at the list.
'''
