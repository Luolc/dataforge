[title]
en = "Review against the skill forge-pr-review too"

[text.statement]
en = "When you review a pull request in this repository, check it also against the skill `forge-pr-review` (`.agents/skills/forge-pr-review/SKILL.md`)."

[text.reason]
en = '''
The skill holds the review points that only this repository has: what may be published, and the design document.
'''

[text.verification]
en = '''
Violated when a verdict on a pull request here does not go through the points of that skill.
'''
