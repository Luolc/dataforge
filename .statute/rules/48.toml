id = 48
slug = "frontend-synthetic-fixtures"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
parent = "R240"
default = "on"
authority = ["personal-info", "sensitive-info"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Make every frontend fixture synthetic"

[text.statement]
en = "Make every fixture that the frontend's tests, demos and screenshots load synthetic: no real person's name, no real repository owner, and no identifier of a real run, machine or private resource."

[text.reason]
en = '''
The repository is public, and so are its screenshots; data copied from real runs would carry people's names and point at private repositories and machines.
'''

[text.verification]
en = '''
Placeholders such as `example-org` for an owner and `Example Author` for a person are synthetic.

Violated when a fixture the frontend loads holds a real person's name, a real repository owner, or an identifier of a real run, machine or private resource.
'''
