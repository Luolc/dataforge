[title]
en = "Change docs/design.md only in a pull request of its own"

[text.statement]
en = "Change `docs/design.md` only in a pull request that changes no other file."

[text.reason]
en = '''
A design pass reads the merged changes and brings the design up to date in one place, so the design is reviewed as a whole and not piecemeal beside the code; every other pull request says its effect on the design under "Design impact".
'''

[text.verification]
en = '''
Violated when a pull request changes `docs/design.md` together with another file.
'''
