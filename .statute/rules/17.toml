[title]
en = "Run the real-Claude smoke test only by hand, when needed"

[text.statement]
en = "Run `cli/dataforge/tests/smoke/run.sh` only by hand, once per change worth checking, never in CI and never in a loop."

[text.reason]
en = '''
Each run starts real Claude sessions through the gateway, taking a gateway session slot and spending model turns.
'''

[text.verification]
en = '''
Violated when the smoke test is added to CI or a scheduled job, or run repeatedly for one change.
'''
