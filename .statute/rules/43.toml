[title]
en = "Format costs, durations and times through one formatter each"

[text.statement]
en = "Format every cost, duration and point in time a page shows through the frontend's one formatter for each, never in the component that shows it."

[text.reason]
en = '''
One formatter per kind keeps `$0.24`, `4m 55s` and the relative time the same on every page, and a change of format is one change.
'''

[text.verification]
en = '''
Violated when a component formats a cost, a duration or a point in time itself (for example with `toFixed`, `toLocaleString` or by building the text), or when the frontend has two formatters for one of the three.
'''
