[title]
en = "Say in a folded group's row what it holds"

[text.statement]
en = "Write in the row of every folded group how many items it holds and how many of them have a `negative` or `warning` status, as in `2 of 4 failed`."

[text.reason]
en = '''
Folding repeated runs keeps a page short only if the folded row still tells the reader whether to open it.
'''

[text.verification]
en = '''
Violated when a folded group's row lacks the number of items it holds, or the number of them with a `negative` or `warning` status.
'''
