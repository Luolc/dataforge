[title]
en = "Show a status by its word or its tone's own icon, not by color alone"

[text.statement]
en = "Show every status with its word or with an icon whose shape no status of another tone ({@rule:38}) uses, never by color alone or by a single letter."

[text.reason]
en = '''
A reader who does not tell the colors apart, or who reads a screenshot in grey, still reads the word or the shape; a letter such as C or I has to be learned before it says anything.
'''

[text.verification]
en = '''
A word shown only in a tooltip does not count. A dot has the same shape in every tone, so a dot alone is color alone.

Violated when a page shows a status by color alone, by an icon whose shape a status of another tone also uses on that page with no word beside it, or by a single letter.
'''
