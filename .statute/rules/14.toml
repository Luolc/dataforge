[title]
en = "The checks a change touches, by what it changes"

[text.statement]
en = '''
The checks a change here touches, besides the commit hooks (`uvx pre-commit run --all-files`), are:

- for `cli/dataforge/`: in that directory `cargo clippy --all-targets --locked -- -D warnings`, `cargo test --locked`, `cargo build --release --locked --target x86_64-unknown-linux-musl` and `tests/e2e/run.sh`, then the setup test, `machine/tests/run.sh` from the top of the repository;
- for `machine/`: the musl build above, then the setup test;
- for a script in `.github/scripts/`: its `.test.sh`; for `docs/design.md`: `.github/scripts/design-length.sh`.
'''

[text.reason]
en = '''
Each check runs where it can fail for the change, and nowhere it cannot.
'''

[text.verification]
en = '''
The e2e test and the setup test need docker, and the setup test network access too; setting `DATAFORGE_MACHINE_APT_CACHE` to a directory keeps apt's downloads there across runs. A change to `.github/workflows/` is checked by its pull request's run of `check`. CI's `check` job runs the full set. When unsure whether a check is touched, it runs.

Violated when a change is pushed without a check this list gives for the paths it changes having passed on the pushed version.
'''
