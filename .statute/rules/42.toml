[title]
en = "Set columns of numbers with tabular figures"

[text.statement]
en = "Set every column of numbers in a table on a page with tabular figures (`font-variant-numeric: tabular-nums`)."

[text.reason]
en = '''
Digits of one width keep each place under the one above it, so a column of costs or durations lines up whatever its digits are.
'''

[text.verification]
en = '''
Violated when a table column whose cells are numbers, such as costs, durations or counts, is set without tabular figures.
'''
