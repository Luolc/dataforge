[title]
en = "Treat this repository as a public one"

[text.statement]
en = "Treat this repository as a public repository under every rule for public repositories, both what they may hold and what must happen before a push to one."

[text.reason]
en = '''
The repository is public, so what is written here is what the public reads.
'''

[text.verification]
en = '''
Violated when a change, a commit message, a pull request or a review here holds what a rule in force forbids in a public repository, or skips a step such a rule asks for before a push to one.
'''
