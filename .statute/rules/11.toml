[title]
en = "Install the commit hooks in each clone"

[text.statement]
en = "In each clone of this repository, run `uvx pre-commit install` once, before the first commit."

[text.reason]
en = '''
The hooks in `.pre-commit-config.yaml` run only once installed, and the secret scan among them is the only check that stops a secret before it becomes a commit.
'''

[text.verification]
en = '''
Violated when a commit is made in a clone where the pre-commit hook is not installed.
'''
