[title]
en = "Add the crate's dependencies for the whole tool at once"

[text.statement]
en = "Add dependencies of the `dataforge` crate for the whole tool at once, in one change, not one by one with the features that use them."

[text.reason]
en = '''
A pull request that changes `Cargo.lock` conflicts with every other one that does; adding dependencies in one change keeps those rare.
'''

[text.verification]
en = '''
Violated when a change adds a dependency for one feature while others it knows it will need are left for later changes.
'''
