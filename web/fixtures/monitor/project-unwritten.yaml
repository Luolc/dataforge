# A synthetic dataset whose monitor database no sampler has written, for the
# Monitor page's screenshot of that state: keep no file at its monitor.db.
# The attempts are the sample dataset's.
id: monitored-unwritten
name: Monitored, not sampled yet
color: "#7fb069"
attempts_dir: ../attempts
attempts: "*/*"
record: record.json
item: { depth: 1, title: Batch }
states:
  author: { title: Author }
  check: { title: Check }
  review: { title: Review }
  solve: { title: Pass@k }
monitor: { db: ../monitor/not-written.sqlite }
