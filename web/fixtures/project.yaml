# A synthetic dataset for developing the viewer and taking screenshots; its
# attempts were made up and ran nowhere. raised has no entry, so it shows as
# the viewer's own default.
id: sample
name: Sample dataset
color: "#e5a54b"
attempts_dir: attempts
attempts: "*/*"
record: record.json
definition: definition.json
states:
  author: { title: Author }
  check: { title: Check }
  review: { title: Review }
  solve: { title: Pass@k }
statuses:
  passed: { label: Passed, tone: good }
  too_easy: { label: Too easy, tone: warn }
  too_hard: { label: Too hard, tone: warn }
  exhausted: { label: Exhausted, tone: bad }
  error: { label: Error, tone: bad }
  done: { label: Done, tone: good }
  pass: { label: Pass, tone: good }
  fail: { label: Fail, tone: bad }
  in_range: { label: In range, tone: good }
  all_solved: { label: All solved, tone: warn }
  none_solved: { label: None solved, tone: warn }
item: { depth: 2, title: Task }
columns:
  - { title: Cap, field: [budget, max_usd], format: usd }
  - { title: Verdict, tab: notes, file: tags.json, field: [verdict, value] }
  # Tags in the heading of an attempt's page; Kind is empty for an attempt
  # that did not pass.
  - title: Kind
    tag: true
    description: How the task of an attempt that passed was made.
    cases:
      - value: tightened
        when:
          - { field: [status], equals: passed }
          - { field: [round], equals: 2 }
      - value: plain
        when: [{ field: [status], equals: passed }]
    labels: { plain: plain, tightened: plain·tightened }
    hints:
      plain: Passed in its first round.
      tightened: Passed in its second round.
  - title: Language
    tag: true
    file: meta.json
    field: [language]
    description: The language of the sample's project.
    labels: { "": "—" }
    hints: { "": Its research found no language for the project. }
    none: The attempt has no meta.json.
# What an attempt delivers once it ends, so a running one shows its tabs.
deliverables:
  - { name: task, kind: files, title: Task }
  - { name: pass_at_k, kind: trials, title: Pass@k }
  - { name: review, kind: report, title: Review }
# Each attempt's notes and the prompt they were written from, Markdown files
# in one or more of its directories, the first of them shown by default; made
# up, as the attempts are.
tabs:
  - name: notes
    title: Notes
    versions: [notes, "notes-*"]
    # Each version by when its notes were finished, not its directory.
    version_title: { file: status.json, field: [ended_at], format: time }
    parts:
      - name: notes
        title: Notes
        file: out/notes.md
        fields:
          - { title: Verdict, file: tags.json, field: [verdict, value] }
          - { title: Confidence, file: tags.json, field: [verdict, confidence] }
          - { title: Outcome, file: status.json, field: [outcome] }
          - { title: Spent, file: status.json, field: [cost_usd], format: usd }
      - { name: prompt, title: Prompt, file: prompt.md }
# The sample's pages: a snapshot of made-up counts of the steps before its
# attempts, whose rows open the bundles beside it, and the attempts.
pages:
  - kind: snapshot
    name: steps
    title: Steps
    file: ../snapshot/steps.json
    roots: { bundles: ../snapshot/bundles }
  - { kind: attempts, name: attempts, title: Attempts }
