# A synthetic dataset with many items for the home page's screenshots; its
# attempts were made up and ran nowhere. item-0199 has no record.
id: home
name: Home sample
color: "#7fc8d6"
attempts_dir: attempts
attempts: "*/*"
record: record.json
states:
  author: { title: Author }
  check: { title: Check }
  solve: { title: Pass@k }
statuses:
  passed: { label: Passed, tone: good }
  too_easy: { label: Too easy, tone: warn }
  too_hard: { label: Too hard, tone: warn }
  exhausted: { label: Exhausted, tone: bad }
  error: { label: Error, tone: bad }
  done: { label: Done, tone: good }
  pass: { label: Pass, tone: good }
  fail: { label: Fail, tone: bad }
  in_range: { label: In range, tone: good }
  all_solved: { label: All solved, tone: warn }
  none_solved: { label: None solved, tone: warn }
item: { depth: 1, title: Item }
columns:
  - { title: Cap, field: [budget, max_usd], format: usd }
  - { title: Round, field: [round], format: number }
  - { title: Kept visit, field: [kept_visit], format: number }
  - { title: Cost, field: [budget, cost_usd], format: usd }
  # A value's hint, and what a cell with no value stands for.
  - title: Verdict
    tab: notes
    file: tags.json
    field: [verdict, value]
    labels: { sound: Sound }
    hints: { sound: The notes found the task sound. }
    none: No notes were written for this attempt, or they gave no verdict.
  # A column of cases, which the page filters by: how a passed attempt got
  # there, by its round; empty for one that did not pass.
  - title: Path
    filter: true
    cases:
      - value: first
        when:
          [{ field: [status], equals: passed }, { field: [round], equals: 1 }]
      - value: again
        when: [{ field: [status], equals: passed }]
    labels: { first: First round, again: Later round }
# Notes of a few attempts, to read the Verdict column from; made up.
tabs:
  - name: notes
    title: Notes
    versions: [notes, "notes-*"]
    file: out/notes.md
