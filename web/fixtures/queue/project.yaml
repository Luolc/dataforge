# project.yaml's synthetic dataset with two actions, which only print the
# item's ID and, for Run again, the budget a person sets, and two kinds of
# job another tool would queue, of which notes makes the Notes tab's
# versions; its attempts were made up and ran nowhere.
id: sample
name: Sample dataset
color: "#e5a54b"
attempts_dir: ../attempts
attempts: "*/*"
record: record.json
states:
  author: { title: Author }
  check: { title: Check }
  review: { title: Review }
  solve: { title: Pass@k }
statuses:
  passed: { label: Passed, tone: good }
  too_easy: { label: Too easy, tone: warn }
  too_hard: { label: Too hard, tone: warn }
  exhausted: { label: Exhausted, tone: bad }
  error: { label: Error, tone: bad }
  done: { label: Done, tone: good }
  pass: { label: Pass, tone: good }
  fail: { label: Fail, tone: bad }
  in_range: { label: In range, tone: good }
  all_solved: { label: All solved, tone: warn }
  none_solved: { label: None solved, tone: warn }
item: { depth: 2, title: Task, pattern: "batch-[0-9]+/task-[0-9]+" }
lock: .lock
columns:
  - { title: Cap, field: [budget, max_usd], format: usd }
  - { title: Verdict, tab: notes, file: tags.json, field: [verdict, value] }
# What an attempt delivers once it ends, so a running one shows its tabs.
deliverables:
  - { name: task, kind: files, title: Task }
  - { name: pass_at_k, kind: trials, title: Pass@k }
  - { name: review, kind: report, title: Review }
actions:
  - name: again
    label: Run again
    queue: fast
    argv: [echo, run, "{item}"]
    cwd: /
    memory_mib: 2048
    key: "sample:{item}"
    when: idle
    params:
      - name: budget
        label: Budget per attempt
        flag: --max-usd
        min: 1
        max: 150
        default: 75
        format: usd
  - name: go-on
    label: Go on
    queue: slow
    argv: [echo, go-on, "{item}"]
    cwd: /
    memory_mib: 1024
    key: "sample:{item}"
    when: stopped
jobs:
  - { action: notes, label: Write notes, queue: slow, subject: attempt }
  - { action: batch, label: Batch, queue: fast }
tabs:
  - name: notes
    title: Notes
    versions: [notes, "notes-*"]
    version_title: { file: status.json, field: [ended_at], format: time }
    file: out/notes.md
    job: notes
