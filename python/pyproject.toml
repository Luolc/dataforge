[project]
name = "dataforge"
version = "0.1.0"
description = "Shared building blocks for dataset repositories: a state machine for building data."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# The viewer, dataforge.viz: a dataset repo that only runs attempts does not
# install it.
viz = [
    "fastapi>=0.150.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
dataforge = "dataforge.cli:main"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    # The checks cover dataforge.viz, so they run with its extra.
    "dataforge[viz]",
    # The Harbor agents of dataforge.gateway.harbor, whose tests import it;
    # the package itself does not depend on Harbor.
    "harbor==0.24.0",
    # FastAPI's TestClient.
    "httpx2==2.15.1",
    "pydoclint==0.11.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
indent-width = 2
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = [
    "B",
    "BLE",
    "C",
    "D",
    "D401",
    "D417",
    "E",
    "F",
    "I",
    "ISC001",
    "N",
    "PLW0129",
    "RUF",
    "SIM",
    "UP",
    "W",
    "W505",
]
ignore = ["D105"]
# pydoclint's codes, which a noqa may name.
external = ["DOC"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = false
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.pydoclint]
style = "google"
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
# Tests import their shared helpers as tests.<...>.
pythonpath = ["."]
# A file or connection left open fails the test; a ResourceWarning raised
# while an object is collected reaches pytest as an unraisable exception.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.basedpyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "recommended"
